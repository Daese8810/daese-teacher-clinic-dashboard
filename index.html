  <script>

    (function disableOldFlutterServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      window.addEventListener('load', function() {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister();

        }).catch(function() {});

        if (window.caches) {
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(key) {
              return caches.delete(key);
            }));
          }).catch(function() {});

      });
    })();

    window.clinicLoadTeacherPreferences = function() {

    window.clinicSaveTeacherPreferences = function(json) {

    window.clinicLoadExamScores = function() {

    function clinicLogoUrl() {
      return new URL('assets/assets/logo.jpg', window.location.href).href;
    }

    function hydrateWorksheetHtml(content) {
      return String(content || '').replace(/__LOGO_URL__/g, clinicLogoUrl());
    }

    window.clinicPrintWorksheet = function(title, rightHeader, content) {
      var printWindow = window.open('', '_blank', 'width=960,height=1200');
      if (!printWindow) {
        window.print();
        return true;
      }

      var source = hydrateWorksheetHtml(content);
      if (source.indexOf('<!DOCTYPE html>') < 0 && source.indexOf('<html') < 0) {
        source = [
          '<!DOCTYPE html>',
          '<html lang="ko">',
          '<head>',
          '<meta charset="UTF-8">',
          '<title>' + (title || 'Worksheet') + '</title>',
          '<style>',
          '@page { size: A4; margin: 14mm; }',
          'body { color: #252525; font-family: Arial, "Malgun Gothic", sans-serif; line-height: 1.55; margin: 0; }',
          'pre { font: inherit; margin: 0; white-space: pre-wrap; }',
          '</style>',
          '</head>',
          '<body><pre></pre></body>',
          '</html>'
        ].join('');
      }

      var doc = printWindow.document;
      doc.open();
      doc.write(source);
      doc.close();
      doc.title = title || 'Worksheet';

      var printWhenReady = function() {
        printWindow.focus();
        printWindow.print();
      };

      if (doc.fonts && doc.fonts.ready) {
        doc.fonts.ready.then(function() {
          setTimeout(printWhenReady, 100);
        }).catch(function() {
          setTimeout(printWhenReady, 250);
        });
      } else {
        setTimeout(printWhenReady, 250);
      }

      return true;
    };

    window.clinicDownloadWorksheetFile = function(fileName, content) {
      try {
        var hydrated = hydrateWorksheetHtml(content);
        var blob = new Blob([hydrated], { type: 'text/html;charset=utf-8' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName || 'writing-worksheet.html';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(function() {
          URL.revokeObjectURL(link.href);
          link.remove();
        }, 0);
        return true;
      } catch (error) {
        return false;
      }
    };

    window.clinicDownloadDataUrlFile = function(fileName, dataUrl) {
      try {
        dataUrl = String(dataUrl || '');
        if (!dataUrl) {
          return false;
        }

        if (dataUrl.indexOf('data:') !== 0) {
          window.open(dataUrl, '_blank');
          return true;
        }

        var commaIndex = dataUrl.indexOf(',');
        if (commaIndex < 0) {
          return false;
        }

        var meta = dataUrl.substring(5, commaIndex);
        var payload = dataUrl.substring(commaIndex + 1);
        var mime = meta.split(';')[0] || 'application/octet-stream';
        var isBase64 = /;base64(?:;|$)/i.test(meta);
        var blob;

        if (isBase64) {
          var binary = atob(payload);
          var chunkSize = 64 * 1024;
          var chunks = [];
          for (var offset = 0; offset < binary.length; offset += chunkSize) {
            var slice = binary.slice(offset, offset + chunkSize);
            var bytes = new Uint8Array(slice.length);
            for (var index = 0; index < slice.length; index += 1) {
              bytes[index] = slice.charCodeAt(index);
            }
            chunks.push(bytes);
          }
          blob = new Blob(chunks, { type: mime });
        } else {
          blob = new Blob([decodeURIComponent(payload)], {
            type: mime + ';charset=utf-8'
          });
        }

        var objectUrl = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = objectUrl;
        link.download = fileName || (mime === 'application/pdf' ? 'clinic-file.pdf' : 'clinic-file');
        link.target = '_blank';
        link.rel = 'noopener';
        link.style.display = 'none';
        document.body.appendChild(link);
        if (typeof MouseEvent === 'function') {
          link.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: window
          }));
        } else {
          link.click();
        }
        setTimeout(function() {
          URL.revokeObjectURL(objectUrl);
          link.remove();
        }, 60000);
        return true;
      } catch (error) {
        return false;
      }
    };

    function clinicDownloadBlob(fileName, blob) {
      var objectUrl = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = objectUrl;
      link.download = fileName || 'clinic-file';
      link.target = '_blank';
      link.rel = 'noopener';
      link.style.display = 'none';
      document.body.appendChild(link);
      if (typeof MouseEvent === 'function') {
        link.dispatchEvent(new MouseEvent('click', {
          bubbles: true,
          cancelable: true,
          view: window
        }));
      } else {
        link.click();
      }
      setTimeout(function() {
        URL.revokeObjectURL(objectUrl);
        link.remove();
      }, 60000);
      return true;
    }

    function clinicCanvasToBlob(canvas, type, quality) {
      return new Promise(function(resolve, reject) {
        canvas.toBlob(function(blob) {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error('canvas blob conversion failed'));
          }
        }, type, quality);
      });
    }

    function clinicSvgTextToCanvas(page, scale) {
      return new Promise(function(resolve, reject) {
        var svg = String(page.svg || '');
        var width = Number(page.width || 595);
        var height = Number(page.height || 842);
        var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        var objectUrl = URL.createObjectURL(blob);
        var image = new Image();
        image.onload = function() {
          try {
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            var context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(objectUrl);
            resolve({ canvas: canvas, width: width, height: height });
          } catch (error) {
            URL.revokeObjectURL(objectUrl);
            reject(error);
          }
        };
        image.onerror = function() {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('SVG render failed'));
        };
        image.src = objectUrl;
      });
    }

    function clinicParseSvgPages(pagesJson) {
      var pages = JSON.parse(String(pagesJson || '[]'));
      if (!Array.isArray(pages) || pages.length === 0) {
        throw new Error('empty report pages');
      }
      return pages;
    }

    async function clinicSvgPagesToCanvas(pagesJson, scale) {
      var pages = clinicParseSvgPages(pagesJson);
      var rendered = [];
      for (var index = 0; index < pages.length; index += 1) {
        rendered.push(await clinicSvgTextToCanvas(pages[index], scale));
      }
      var gap = rendered.length <= 1 ? 0 : Math.round(72 * scale);
      var width = rendered.reduce(function(max, item) {
        return Math.max(max, item.canvas.width);
      }, 0);
      var height = rendered.reduce(function(sum, item) {
        return sum + item.canvas.height;
      }, 0) + gap * (rendered.length - 1);
      var output = document.createElement('canvas');
      output.width = width;
      output.height = height;
      var context = output.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, width, height);
      var top = 0;
      rendered.forEach(function(item) {
        var left = Math.round((width - item.canvas.width) / 2);
        context.drawImage(item.canvas, left, top);
        top += item.canvas.height + gap;
      });
      return output;
    }

    async function clinicSvgPagesToPngBlob(pagesJson, scale) {
      var canvas = await clinicSvgPagesToCanvas(pagesJson, scale);
      var blob = await clinicCanvasToBlob(canvas, 'image/png');
      return { blob: blob, width: canvas.width, height: canvas.height };
    }

    async function clinicSvgPagesToKakaoCardPngBlob(pagesJson) {
      var source = await clinicSvgPagesToCanvas(pagesJson, 3);
      var output = document.createElement('canvas');
      output.width = 800;
      output.height = 800;
      var context = output.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, output.width, output.height);

      var sourceCropHeight = Math.round(source.height * (560 / 844));
      var targetHeight = 792;
      var targetWidth = source.width * (targetHeight / sourceCropHeight);
      var left = Math.round((output.width - targetWidth) / 2);
      var top = 4;
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.drawImage(
        source,
        0,
        0,
        source.width,
        sourceCropHeight,
        left,
        top,
        targetWidth,
        targetHeight
      );

      var blob = await clinicCanvasToBlob(output, 'image/png');
      return { blob: blob, width: output.width, height: output.height };
    }

    async function clinicSvgPagesToKakaoSizedPngBlob(pagesJson) {
      var maxBytes = 5 * 1024 * 1024;
      var result = await clinicSvgPagesToKakaoCardPngBlob(pagesJson);
      if (result.blob.size <= maxBytes) {
        return result;
      }
      throw new Error('Kakao image upload limit exceeded: ' + result.blob.size);
    }

    function clinicGetKakaoShareConfig() {
      return window.clinicKakaoShareConfig || {};
    }

    function clinicEnsureKakaoShareReady() {
      var config = clinicGetKakaoShareConfig();
      var key = String(config.javascriptKey || '').trim();
      var kakao = window.Kakao;
      if (!key || !kakao || typeof kakao.init !== 'function') {
        return false;
      }
      if (typeof kakao.isInitialized !== 'function' || !kakao.isInitialized()) {
        kakao.init(key);
      }
      return !!(
        typeof kakao.isInitialized === 'function' &&
        kakao.isInitialized() &&
        kakao.Share &&
        typeof kakao.Share.uploadImage === 'function' &&
        typeof kakao.Share.sendDefault === 'function'
      );
    }

    function clinicFileListFromFile(file) {
      if (typeof DataTransfer !== 'function') {
        throw new Error('DataTransfer is not available');
      }
      var transfer = new DataTransfer();
      transfer.items.add(file);
      return transfer.files;
    }

    function clinicSafeHttpUrl(url) {
      var value = String(url || '').trim();
      if (/^https?:\/\//i.test(value)) {
        return value;
      }
      var configUrl = String(clinicGetKakaoShareConfig().linkUrl || '').trim();
      if (/^https?:\/\//i.test(configUrl)) {
        return configUrl;
      }
      return window.location && window.location.origin
        ? window.location.origin + '/'
        : 'https://daeseenglish.com/';
    }

    window.clinicDownloadSvgReportPng = async function(fileName, pagesJson) {
      try {
        var result = await clinicSvgPagesToPngBlob(pagesJson, 3);
        return clinicDownloadBlob(fileName || 'monthly-report.png', result.blob);
      } catch (error) {
        console.error('clinicDownloadSvgReportPng failed', error);
        return false;
      }
    };

    window.clinicShareSvgReportPngToKakao = async function(fileName, pagesJson, title, description, linkUrl) {
      try {
        if (!clinicEnsureKakaoShareReady()) {
          return false;
        }
        var rendered = await clinicSvgPagesToKakaoSizedPngBlob(pagesJson);
        var safeFileName = String(fileName || 'monthly-report.png').trim() || 'monthly-report.png';
        if (!/\.png$/i.test(safeFileName)) {
          safeFileName += '.png';
        }
        var file = new File([rendered.blob], safeFileName, {
          type: 'image/png',
          lastModified: Date.now()
        });
        var uploaded = await window.Kakao.Share.uploadImage({
          file: clinicFileListFromFile(file)
        });
        var imageUrl = uploaded &&
          uploaded.infos &&
          uploaded.infos.original &&
          uploaded.infos.original.url;
        if (!imageUrl) {
          throw new Error('Kakao image URL missing');
        }
        var targetUrl = clinicSafeHttpUrl(linkUrl);
        await window.Kakao.Share.sendDefault({
          objectType: 'feed',
          content: {
            title: '\u200B',
            description: '\u200B',
            imageUrl: imageUrl,
            imageWidth: rendered.width,
            imageHeight: rendered.height,
            link: {
              mobileWebUrl: targetUrl,
              webUrl: targetUrl
            }
          },
          installTalk: true
        });
        return true;
      } catch (error) {
        console.error('clinicShareSvgReportPngToKakao failed', error);
        return false;
      }
    };

    function clinicAsciiBytes(text) {
      return new TextEncoder().encode(String(text || ''));
    }

    async function clinicImageBytesFromCanvas(canvas) {
      var blob = await clinicCanvasToBlob(canvas, 'image/jpeg', 0.92);
      return new Uint8Array(await blob.arrayBuffer());
    }

    function clinicCreateImagePdf(rendered, imageBytes) {
      var chunks = [];
      var offsets = [0];
      var position = 0;

      function push(part) {
        var bytes = typeof part === 'string' ? clinicAsciiBytes(part) : part;
        chunks.push(bytes);
        position += bytes.length;
      }

      function addObject(id, parts) {
        offsets[id] = position;
        push(id + ' 0 obj\n');
        parts.forEach(push);
        push('\nendobj\n');
      }

      var pageCount = rendered.length;
      var maxObjectId = 2 + pageCount * 3;
      push('%PDF-1.3\n');
      addObject(1, ['<< /Type /Catalog /Pages 2 0 R >>']);
      var kids = [];
      for (var i = 0; i < pageCount; i += 1) {
        kids.push((3 + i * 3) + ' 0 R');
      }
      addObject(2, ['<< /Type /Pages /Kids [', kids.join(' '), '] /Count ', String(pageCount), ' >>']);

      for (var pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
        var pageObj = 3 + pageIndex * 3;
        var contentObj = pageObj + 1;
        var imageObj = pageObj + 2;
        var page = rendered[pageIndex];
        var mediaWidth = Number(page.width || 595);
        var mediaHeight = Number(page.height || 842);
        var draw = 'q\n' + mediaWidth + ' 0 0 ' + mediaHeight + ' 0 0 cm\n/Im' + pageIndex + ' Do\nQ\n';
        var image = imageBytes[pageIndex];
        addObject(pageObj, [
          '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ',
          String(mediaWidth),
          ' ',
          String(mediaHeight),
          '] /Resources << /XObject << /Im',
          String(pageIndex),
          ' ',
          String(imageObj),
          ' 0 R >> >> /Contents ',
          String(contentObj),
          ' 0 R >>'
        ]);
        addObject(contentObj, [
          '<< /Length ',
          String(clinicAsciiBytes(draw).length),
          ' >>\nstream\n',
          draw,
          'endstream'
        ]);
        offsets[imageObj] = position;
        push(imageObj + ' 0 obj\n');
        push('<< /Type /XObject /Subtype /Image /Width ' + page.canvas.width +
          ' /Height ' + page.canvas.height +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
          image.length + ' >>\nstream\n');
        push(image);
        push('\nendstream\nendobj\n');
      }

      var xrefOffset = position;
      push('xref\n0 ' + (maxObjectId + 1) + '\n');
      push('0000000000 65535 f \n');
      for (var objectId = 1; objectId <= maxObjectId; objectId += 1) {
        push(String(offsets[objectId]).padStart(10, '0') + ' 00000 n \n');
      }
      push('trailer\n<< /Size ' + (maxObjectId + 1) + ' /Root 1 0 R >>\n');
      push('startxref\n' + xrefOffset + '\n%%EOF');
      return new Blob(chunks, { type: 'application/pdf' });
    }

    window.clinicDownloadSvgReportPdf = async function(fileName, pagesJson) {
      try {
        var pages = clinicParseSvgPages(pagesJson);
        var scale = 2.4;
        var rendered = [];
        var imageBytes = [];
        for (var index = 0; index < pages.length; index += 1) {
          var page = await clinicSvgTextToCanvas(pages[index], scale);
          rendered.push(page);
          imageBytes.push(await clinicImageBytesFromCanvas(page.canvas));
        }
        var pdf = clinicCreateImagePdf(rendered, imageBytes);
        return clinicDownloadBlob(fileName || 'monthly-report.pdf', pdf);
      } catch (error) {
        console.error('clinicDownloadSvgReportPdf failed', error);
        return false;
      }
    };
  </script>
