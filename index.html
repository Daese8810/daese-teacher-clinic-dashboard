  <script>
    (function disableOldFlutterServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      window.addEventListener('load', function() {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister();
          });
        }).catch(function() {});

        if (window.caches) {
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(key) {
              return caches.delete(key);
            }));
          }).catch(function() {});
        }
      });
    })();

    (function configureWebBuildUpdates() {
      var currentBuild = null;
      var buildCheckTimer = null;
      var buildCheckInFlight = false;
      var updatePromptVisible = false;
      var snoozedBuildId = '';
      var snoozedUntil = 0;
      var updateSnoozeStorageKey = 'clinic_web_update_snooze_v1';
      var updateSnoozeMs = 30 * 60 * 1000;

      function normalizeBuildManifest(value) {
        if (!value || typeof value !== 'object') {
          return null;
        }
        var version = String(value.version || '').trim();
        var buildNumber = Number(value.build_number ?? value.buildNumber);
        if (!version || !Number.isInteger(buildNumber) || buildNumber < 0) {
          return null;
        }
        return {
          version: version,
          buildNumber: buildNumber,
          id: version + '+' + buildNumber
        };
      }

      async function fetchPublishedBuild() {
        var manifestUrl = new URL('version.json', document.baseURI);
        manifestUrl.searchParams.set(
          'clinic_cache_bust',
          String(Date.now())
        );
        var response = await fetch(manifestUrl.toString(), {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache',
            'Pragma': 'no-cache'
          }
        });
        if (!response.ok) {
          throw new Error('version manifest HTTP ' + response.status);
        }
        var manifest = normalizeBuildManifest(await response.json());
        if (!manifest) {
          throw new Error('invalid version manifest');
        }
        return manifest;
      }

      function isNewerBuild(latest, loaded) {
        if (latest.buildNumber !== loaded.buildNumber) {
          return latest.buildNumber > loaded.buildNumber;
        }
        return latest.version !== loaded.version;
      }

      function loadSnoozeState() {
        try {
          var raw = window.localStorage.getItem(updateSnoozeStorageKey);
          if (!raw) {
            return;
          }
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') {
            return;
          }
          snoozedBuildId = String(parsed.buildId || '');
          snoozedUntil = Number(parsed.until || 0);
        } catch (error) {}
      }

      function clearSnoozeState() {
        snoozedBuildId = '';
        snoozedUntil = 0;
        try {
          window.localStorage.removeItem(updateSnoozeStorageKey);
        } catch (error) {}
      }

      function snoozeBuild(build) {
        snoozedBuildId = build.id;
        snoozedUntil = Date.now() + updateSnoozeMs;
        try {
          window.localStorage.setItem(
            updateSnoozeStorageKey,
            JSON.stringify({
              buildId: snoozedBuildId,
              until: snoozedUntil
            })
          );
        } catch (error) {}
      }

      function isSnoozedBuild(build) {
        if (snoozedBuildId !== build.id) {
          return false;
        }
        if (Date.now() < snoozedUntil) {
          return true;
        }
        clearSnoozeState();
        return false;
      }

      async function reloadForBuild(build) {
        try {
          if ('serviceWorker' in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          }
          if (window.caches) {
            var cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map(function(key) {
              return caches.delete(key);
            }));
          }
        } catch (error) {
          console.warn('Failed to clear old web build caches', error);
        }

        var nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('clinic_web_build', build.id);
        nextUrl.searchParams.set('clinic_cache_bust', String(Date.now()));
        window.location.replace(nextUrl.toString());
      }

      function blockForPublishedBuild(latest) {
        if (updatePromptVisible || isSnoozedBuild(latest)) {
          return;
        }
        updatePromptVisible = true;

        var overlay = document.createElement('div');
        overlay.id = 'clinic-web-update-blocker';
        overlay.setAttribute('role', 'alertdialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.style.cssText = [
          'position:fixed',
          'inset:0',
          'z-index:2147483647',
          'display:flex',
          'align-items:center',
          'justify-content:center',
          'padding:24px',
          'background:rgba(37,37,37,0.58)',
          'font-family:Pretendard,Malgun Gothic,Apple SD Gothic Neo,sans-serif'
        ].join(';');

        var panel = document.createElement('div');
        panel.style.cssText = [
          'width:min(520px,100%)',
          'box-sizing:border-box',
          'padding:28px',
          'border-radius:20px',
          'background:#fff',
          'box-shadow:0 20px 60px rgba(0,0,0,0.24)',
          'color:#252525'
        ].join(';');

        var title = document.createElement('h2');
        title.textContent = '새 버전이 배포되었습니다';
        title.style.cssText = 'margin:0 0 12px;font-size:22px;line-height:1.35';

        var message = document.createElement('p');
        message.textContent =
          '지금 업데이트하면 캐시를 비우고 새 화면을 다시 불러옵니다. 작업 중인 내용이 있으면 마무리한 뒤 직접 새로고침해 주세요.';
        message.style.cssText =
          'margin:0 0 20px;color:#6f625c;font-size:15px;line-height:1.6';

        var actions = document.createElement('div');
        actions.style.cssText = [
          'display:flex',
          'gap:10px',
          'flex-wrap:wrap'
        ].join(';');

        var primaryButton = document.createElement('button');
        primaryButton.type = 'button';
        primaryButton.textContent = '지금 업데이트 하기';
        primaryButton.style.cssText = [
          'flex:1 1 190px',
          'min-height:48px',
          'padding:10px 16px',
          'border:0',
          'border-radius:14px',
          'background:#ff6b22',
          'color:#fff',
          'font:700 15px Pretendard,Malgun Gothic,sans-serif',
          'line-height:1.3',
          'white-space:normal',
          'cursor:pointer'
        ].join(';');
        primaryButton.addEventListener('click', function() {
          primaryButton.disabled = true;
          secondaryButton.disabled = true;
          primaryButton.textContent = '업데이트 중...';
          reloadForBuild(latest);
        });

        var secondaryButton = document.createElement('button');
        secondaryButton.type = 'button';
        secondaryButton.textContent = '나중에 직접하기(컨트롤 +F5)';
        secondaryButton.style.cssText = [
          'flex:1 1 220px',
          'min-height:48px',
          'padding:10px 16px',
          'border:1px solid #d8d0ca',
          'border-radius:14px',
          'background:#fff',
          'color:#4f4641',
          'font:700 15px Pretendard,Malgun Gothic,sans-serif',
          'line-height:1.3',
          'white-space:normal',
          'cursor:pointer'
        ].join(';');

        var inertElements = [];
        function closeOverlay() {
          inertElements.forEach(function(child) {
            child.inert = false;
          });
          overlay.remove();
          updatePromptVisible = false;
        }

        secondaryButton.addEventListener('click', function() {
          snoozeBuild(latest);
          closeOverlay();
        });

        actions.appendChild(primaryButton);
        actions.appendChild(secondaryButton);
        panel.appendChild(title);
        panel.appendChild(message);
        panel.appendChild(actions);
        overlay.appendChild(panel);

        Array.from(document.body.children).forEach(function(child) {
          if (!child.inert) {
            child.inert = true;
            inertElements.push(child);
          }
        });
        document.body.appendChild(overlay);
        primaryButton.focus();
      }

      async function checkForPublishedBuild() {
        if (!currentBuild || buildCheckInFlight || updatePromptVisible) {
          return;
        }
        buildCheckInFlight = true;
        try {
          var latest = await fetchPublishedBuild();
          if (isNewerBuild(latest, currentBuild)) {
            blockForPublishedBuild(latest);
          }
        } catch (error) {
          console.warn('Failed to check the published web build', error);
        } finally {
          buildCheckInFlight = false;
        }
      }

      window.clinicStartWebBuildGuard = function(version, buildNumber) {
        var loaded = normalizeBuildManifest({
          version: version,
          build_number: buildNumber
        });
        if (!loaded) {
          return;
        }
        loadSnoozeState();
        currentBuild = loaded;
        if (buildCheckTimer === null) {
          buildCheckTimer = window.setInterval(
            checkForPublishedBuild,
            60 * 1000
          );
          document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
              checkForPublishedBuild();
            }
          });
          window.addEventListener('focus', checkForPublishedBuild);
          window.addEventListener('pageshow', checkForPublishedBuild);
        }
        checkForPublishedBuild();
      };

      window.clinicLoadFlutterApp = async function() {
        var buildId;
        try {
          buildId = (await fetchPublishedBuild()).id;
        } catch (error) {
          console.warn('Failed to load the web build manifest', error);
          buildId = 'uncached-' + Date.now();
        }
        window.clinicBootstrapBuildId = buildId;

        var bootstrapUrl = new URL('flutter_bootstrap.js', document.baseURI);
        bootstrapUrl.searchParams.set('clinic_build', buildId);
        var script = document.createElement('script');
        script.src = bootstrapUrl.toString();
        script.async = true;
        document.body.appendChild(script);
      };
    })();

    function clinicLogoUrl() {
      return new URL('assets/assets/logo.jpg', window.location.href).href;
    }

    function clinicWordTestLogoUrl() {
      return new URL('assets/assets/transparentlogo.png', window.location.href).href;
    }

    function hydrateWorksheetHtml(content) {
      return String(content || '')
        .replace(/__WORD_TEST_LOGO_URL__/g, clinicWordTestLogoUrl())
        .replace(/__LOGO_URL__/g, clinicLogoUrl());
    }

    function waitForWorksheetImages(doc) {
      var images = Array.from(doc.images || []);
      if (images.length === 0) {
        return Promise.resolve();
      }
      var loaded = Promise.all(images.map(function(image) {
        if (image.complete) {
          return Promise.resolve();
        }
        return new Promise(function(resolve) {
          image.addEventListener('load', resolve, { once: true });
          image.addEventListener('error', resolve, { once: true });
        });
      }));
      var timeout = new Promise(function(resolve) {
        setTimeout(resolve, 1500);
      });
      return Promise.race([loaded, timeout]);
    }

    function writeWorksheetPrintWindow(printWindow, title, content) {
      var source = hydrateWorksheetHtml(content);
      if (source.indexOf('<!DOCTYPE html>') < 0 && source.indexOf('<html') < 0) {
        source = [
          '<!DOCTYPE html>',
          '<html lang="ko">',
          '<head>',
          '<meta charset="UTF-8">',
          '<title>' + (title || 'Worksheet') + '</title>',
          '<style>',
          '@page { size: A4; margin: 14mm; }',
          'body { color: #252525; font-family: "Pretendard", Arial, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.55; margin: 0; }',
          'pre { font: inherit; margin: 0; white-space: pre-wrap; }',
          '</style>',
          '</head>',
          '<body><pre></pre></body>',
          '</html>'
        ].join('');
      }

      var doc = printWindow.document;
      doc.open();
      doc.write(source);
      doc.close();
      doc.title = title || 'Worksheet';

      var printWhenReady = function() {
        printWindow.focus();
        printWindow.print();
      };

      var fontsReady = doc.fonts && doc.fonts.ready
        ? doc.fonts.ready.catch(function() {})
        : Promise.resolve();
      Promise.all([fontsReady, waitForWorksheetImages(doc)]).then(function() {
        setTimeout(printWhenReady, 100);
      }).catch(function() {
        setTimeout(printWhenReady, 250);
      });

      return true;
    }

    window.clinicPrintWorksheet = function(title, rightHeader, content) {
      var printWindow = window.open('', '_blank', 'width=960,height=1200');
      if (!printWindow) {
        return false;
      }

      return writeWorksheetPrintWindow(printWindow, title, content);
    };

    window.clinicPreparedPrintWindows = {};

    window.clinicPrepareWorksheetPrintWindow = function(title) {
      try {
        var printWindow = window.open('', '_blank', 'width=960,height=1200');
        if (!printWindow) {
          return '';
        }
        var token = 'clinic-print-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        window.clinicPreparedPrintWindows[token] = printWindow;
        var doc = printWindow.document;
        doc.open();
        doc.write([
          '<!DOCTYPE html>',
          '<html lang="ko">',
          '<head>',
          '<meta charset="UTF-8">',
          '<title>' + (title || 'Worksheet') + '</title>',
          '<style>',
          'body { color: #252525; font-family: "Pretendard", Arial, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; padding: 28px; }',
          '</style>',
          '</head>',
          '<body>정답지를 영작 관리에 업로드하는 중입니다.</body>',
          '</html>'
        ].join(''));
        doc.close();
        return token;
      } catch (error) {
        return '';
      }
    };

    window.clinicCompletePreparedWorksheetPrintWindow = function(token, title, rightHeader, content) {
      try {
        var printWindow = window.clinicPreparedPrintWindows[token];
        delete window.clinicPreparedPrintWindows[token];
        if (!printWindow || printWindow.closed) {
          return false;
        }
        return writeWorksheetPrintWindow(printWindow, title, content);
      } catch (error) {
        return false;
      }
    };

    window.clinicCancelPreparedWorksheetPrintWindow = function(token, message) {
      try {
        var printWindow = window.clinicPreparedPrintWindows[token];
        delete window.clinicPreparedPrintWindows[token];
        if (!printWindow || printWindow.closed) {
          return true;
        }
        if (!message) {
          printWindow.close();
          return true;
        }
        var doc = printWindow.document;
        doc.open();
        doc.write([
          '<!DOCTYPE html>',
          '<html lang="ko">',
          '<head><meta charset="UTF-8"><title>인쇄 취소</title></head>',
          '<body style="font-family: &quot;Pretendard&quot;, Arial, &quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans KR&quot;, sans-serif; padding: 28px;">',
          String(message),
          '</body></html>'
        ].join(''));
        doc.close();
        return true;
      } catch (error) {
        return false;
      }
    };

    window.clinicDownloadWorksheetFile = function(fileName, content) {
      try {
        var hydrated = hydrateWorksheetHtml(content);
        var blob = new Blob([hydrated], { type: 'text/html;charset=utf-8' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName || 'writing-worksheet.html';
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        setTimeout(function() {
          URL.revokeObjectURL(link.href);
          link.remove();
        }, 0);
        return true;
      } catch (error) {
        return false;
      }
    };

    window.clinicDownloadDataUrlFile = function(fileName, dataUrl) {
      try {
        dataUrl = String(dataUrl || '');
        if (!dataUrl) {
          return false;
        }

        if (dataUrl.indexOf('data:') !== 0) {
          window.open(dataUrl, '_blank');
          return true;
        }

        var commaIndex = dataUrl.indexOf(',');
        if (commaIndex < 0) {
          return false;
        }

        var meta = dataUrl.substring(5, commaIndex);
        var payload = dataUrl.substring(commaIndex + 1);
        var mime = meta.split(';')[0] || 'application/octet-stream';
        var isBase64 = /;base64(?:;|$)/i.test(meta);
        var blob;

        if (isBase64) {
          var binary = atob(payload);
          var chunkSize = 64 * 1024;
          var chunks = [];
          for (var offset = 0; offset < binary.length; offset += chunkSize) {
            var slice = binary.slice(offset, offset + chunkSize);
            var bytes = new Uint8Array(slice.length);
            for (var index = 0; index < slice.length; index += 1) {
              bytes[index] = slice.charCodeAt(index);
            }
            chunks.push(bytes);
          }
          blob = new Blob(chunks, { type: mime });
        } else {
          blob = new Blob([decodeURIComponent(payload)], {
            type: mime + ';charset=utf-8'
          });
        }

        var objectUrl = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = objectUrl;
        link.download = fileName || (mime === 'application/pdf' ? 'clinic-file.pdf' : 'clinic-file');
        link.target = '_blank';
        link.rel = 'noopener';
        link.style.display = 'none';
        document.body.appendChild(link);
        if (typeof MouseEvent === 'function') {
          link.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            cancelable: true,
            view: window
          }));
        } else {
          link.click();
        }
        setTimeout(function() {
          URL.revokeObjectURL(objectUrl);
          link.remove();
        }, 60000);
        return true;
      } catch (error) {
        return false;
      }
    };

    function clinicDownloadBlob(fileName, blob) {

    }

    function clinicCanvasToBlob(canvas, type, quality) {
      return new Promise(function(resolve, reject) {
        canvas.toBlob(function(blob) {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error('canvas blob conversion failed'));
          }
        }, type, quality);
      });
    }

    function clinicSvgTextToCanvas(page, scale) {
      return new Promise(function(resolve, reject) {
        var svg = String(page.svg || '');
        var width = Number(page.width || 595);
        var height = Number(page.height || 842);
        var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        var objectUrl = URL.createObjectURL(blob);
        var image = new Image();
        image.onload = function() {
          try {
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(width * scale);
            canvas.height = Math.round(height * scale);
            var context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(objectUrl);
            resolve({ canvas: canvas, width: width, height: height });
          } catch (error) {
            URL.revokeObjectURL(objectUrl);
            reject(error);
          }
        };
        image.onerror = function() {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('SVG render failed'));
        };
        image.src = objectUrl;
      });
    }

    function clinicParseSvgPages(pagesJson) {
      var pages = JSON.parse(String(pagesJson || '[]'));
      if (!Array.isArray(pages) || pages.length === 0) {
        throw new Error('empty report pages');
      }
      return pages;
    }

    async function clinicSvgPagesToCanvas(pagesJson, scale) {
      var pages = clinicParseSvgPages(pagesJson);
      var rendered = [];
      for (var index = 0; index < pages.length; index += 1) {
        rendered.push(await clinicSvgTextToCanvas(pages[index], scale));
      }
      var gap = rendered.length <= 1 ? 0 : Math.round(72 * scale);
      var width = rendered.reduce(function(max, item) {
        return Math.max(max, item.canvas.width);
      }, 0);
      var height = rendered.reduce(function(sum, item) {
        return sum + item.canvas.height;
      }, 0) + gap * (rendered.length - 1);
      var output = document.createElement('canvas');
      output.width = width;
      output.height = height;
      var context = output.getContext('2d');
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, width, height);
      var top = 0;
      rendered.forEach(function(item) {
        var left = Math.round((width - item.canvas.width) / 2);
        context.drawImage(item.canvas, left, top);
        top += item.canvas.height + gap;
      });
      return output;
    }

    async function clinicSvgPagesToPngBlob(pagesJson, scale) {
      var canvas = await clinicSvgPagesToCanvas(pagesJson, scale);
      var blob = await clinicCanvasToBlob(canvas, 'image/png');
      return { blob: blob, width: canvas.width, height: canvas.height };
    }

    window.clinicDownloadSvgReportPng = async function(fileName, pagesJson) {
      try {
        var result = await clinicSvgPagesToPngBlob(pagesJson, 3);
        return clinicDownloadBlob(fileName || 'monthly-report.png', result.blob);
      } catch (error) {
        console.error('clinicDownloadSvgReportPng failed', error);
        return false;
      }
    };

    function clinicAsciiBytes(text) {
      return new TextEncoder().encode(String(text || ''));
    }

    async function clinicImageBytesFromCanvas(canvas) {
      var blob = await clinicCanvasToBlob(canvas, 'image/jpeg', 0.92);
      return new Uint8Array(await blob.arrayBuffer());
    }

    function clinicCreateImagePdf(rendered, imageBytes) {
      var chunks = [];
      var offsets = [0];
      var position = 0;

      function push(part) {
        var bytes = typeof part === 'string' ? clinicAsciiBytes(part) : part;
        chunks.push(bytes);
        position += bytes.length;
      }

      function addObject(id, parts) {
        offsets[id] = position;
        push(id + ' 0 obj\n');
        parts.forEach(push);
        push('\nendobj\n');
      }

      var pageCount = rendered.length;
      var maxObjectId = 2 + pageCount * 3;
      push('%PDF-1.3\n');
      addObject(1, ['<< /Type /Catalog /Pages 2 0 R >>']);
      var kids = [];
      for (var i = 0; i < pageCount; i += 1) {
        kids.push((3 + i * 3) + ' 0 R');
      }
      addObject(2, ['<< /Type /Pages /Kids [', kids.join(' '), '] /Count ', String(pageCount), ' >>']);

      for (var pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
        var pageObj = 3 + pageIndex * 3;
        var contentObj = pageObj + 1;
        var imageObj = pageObj + 2;
        var page = rendered[pageIndex];
        var mediaWidth = Number(page.width || 595);
        var mediaHeight = Number(page.height || 842);
        var draw = 'q\n' + mediaWidth + ' 0 0 ' + mediaHeight + ' 0 0 cm\n/Im' + pageIndex + ' Do\nQ\n';
        var image = imageBytes[pageIndex];
        addObject(pageObj, [
          '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ',
          String(mediaWidth),
          ' ',
          String(mediaHeight),
          '] /Resources << /XObject << /Im',
          String(pageIndex),
          ' ',
          String(imageObj),
          ' 0 R >> >> /Contents ',
          String(contentObj),
          ' 0 R >>'
        ]);
        addObject(contentObj, [
          '<< /Length ',
          String(clinicAsciiBytes(draw).length),
          ' >>\nstream\n',
          draw,
          'endstream'
        ]);
        offsets[imageObj] = position;
        push(imageObj + ' 0 obj\n');
        push('<< /Type /XObject /Subtype /Image /Width ' + page.canvas.width +
          ' /Height ' + page.canvas.height +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
          image.length + ' >>\nstream\n');
        push(image);
        push('\nendstream\nendobj\n');
      }

      var xrefOffset = position;
      push('xref\n0 ' + (maxObjectId + 1) + '\n');
      push('0000000000 65535 f \n');
      for (var objectId = 1; objectId <= maxObjectId; objectId += 1) {
        push(String(offsets[objectId]).padStart(10, '0') + ' 00000 n \n');
      }
      push('trailer\n<< /Size ' + (maxObjectId + 1) + ' /Root 1 0 R >>\n');
      push('startxref\n' + xrefOffset + '\n%%EOF');
      return new Blob(chunks, { type: 'application/pdf' });
    }

    async function clinicBuildSvgReportPdfBlob(pagesJson) {
        var pages = clinicParseSvgPages(pagesJson);
        var scale = 2.4;
        var rendered = [];
        var imageBytes = [];
        for (var index = 0; index < pages.length; index += 1) {
          var page = await clinicSvgTextToCanvas(pages[index], scale);
          rendered.push(page);
          imageBytes.push(await clinicImageBytesFromCanvas(page.canvas));
        }
      return clinicCreateImagePdf(rendered, imageBytes);
    }

    function clinicBlobToDataUrl(blob) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() {
          resolve(String(reader.result || ''));
        };
        reader.onerror = function() {
          reject(reader.error || new Error('Failed to read blob'));
        };
        reader.readAsDataURL(blob);
      });
    }

    window.clinicBuildSvgReportPdfDataUrl = async function(pagesJson) {
      try {
        var pdf = await clinicBuildSvgReportPdfBlob(pagesJson);
        return await clinicBlobToDataUrl(pdf);
      } catch (error) {
        console.error('clinicBuildSvgReportPdfDataUrl failed', error);
        return '';
      }
    };

    window.clinicDownloadSvgReportPdf = async function(fileName, pagesJson) {
      try {
        var pdf = await clinicBuildSvgReportPdfBlob(pagesJson);
        return clinicDownloadBlob(fileName || 'monthly-report.pdf', pdf);
      } catch (error) {
        console.error('clinicDownloadSvgReportPdf failed', error);
        return false;
      }
    };
  </script>
